<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Biblio: a plain-language watch on how technology takes shape, from twenty research fields. A technology observatory: bibliometric trajectories, bursts, and backtested forecasts across 20 technology domains." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Biblio, watching how technology takes shape" />
    <meta property="og:description" content="A quiet, plain-language read on research across twenty fields: what is rising, what is burning, and what the models honestly expect next." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Biblio, watching how technology takes shape" />
    <meta name="twitter:description" content="Twenty fields, one quiet observatory. Backtested, honest, plain-language." />
    <meta name="twitter:image" content="/og-cover.png" />
    <title>Biblio — watching how technology takes shape</title>
    <script>
      // Set theme before first paint to avoid flash.
      (function () {
        var stored = null
        try { stored = localStorage.getItem('bt-theme') } catch (e) {}
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
