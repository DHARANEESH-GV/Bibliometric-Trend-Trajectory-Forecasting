<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Biblio: a plain-language watch on how technology takes shape, from twenty research fields. A technology observatory: bibliometric trajectories, bursts, and backtested forecasts across 20 technology domains." />
    <title>Biblio — watching how technology takes shape</title>
    <script>
      // Set theme before first paint to avoid flash.
      (function () {
        var stored = null
        try { stored = localStorage.getItem('bt-theme') } catch (e) {}
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
